display_text: "Gas Classification - Multi-modal"
modality: multi  # 'image', 'sensor', or 'multi'

nc: 4
names:
  0: Mixture
  1: NoGas
  2: Perfume
  3: Smoke

inference:
  handler: sensor_flat
  task: classify  # 'detect' or 'classify'
  model_path: models/ov_models/gas_detection/image/best.xml
  device: GPU
  confidence_threshold: 0.25
  imgsz: 640
  input_mode: images  # 'video' or 'images'
  images_path: datasets/gas_detection/images/val

sensor:
  model_path: models/ov_models/gas_detection/sensor_mlp/sensor_mlp.xml
  data_path: datasets/gas_detection/sensor_data/Gas_Sensors_Measurements.csv

# Late fusion weights for multi-modal inference
fusion_weights:
  image: 0.6
  sensor: 0.4

sqlite:
  db_path: out/gas_detection/sql_data/detections.db
  clear_on_run: true
  clear_outputs: true

agents:
  active: [policy, analysis, evidence]
  confidence_threshold: 0.5
  report_top_n: 5
  execution_mode: sequential
  shared_device: GPU

  policy:
    llm_mode: model
    model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
    device: GPU

  analysis:
    llm_mode: model
    model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
    device: GPU

  evidence:
    llm_mode: model
    model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
    device: GPU

glue:
  mode: model
  model_id: models/ov_models/llms/Phi-4-mini-instruct-int4gq
  device: GPU
  max_steps: 4
  verbose: true
  enable_cache: false
  suppress_thinking: true
  server_url: http://localhost:8000
  server_port: 8000

sql:
  model_id: models/ov_models/llms/sqlcoder-7b-2-int4cw
  device: GPU
  server_url: http://localhost:8000
  server_port: 8000
  use_case: gas_detection

# Database schema for gas classification results
schema:
  table_name: detections
  columns:
    - name: id
      type: INTEGER PRIMARY KEY AUTOINCREMENT
      required: false
    - name: image_id
      type: INTEGER
      required: true
    - name: source
      type: TEXT
      required: true
    - name: label
      type: TEXT
      required: true
    - name: confidence
      type: REAL
      required: true
    - name: image_confidence
      type: REAL
      required: false
    - name: sensor_confidence
      type: REAL
      required: false
    - name: sensor_raw_json
      type: TEXT
      required: false
    - name: created_at
      type: TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      required: false
  indexes:
    - label
    - confidence
    - source

# Mapping from classification result to schema columns.
# For classification tasks, the result dict has: source, label, confidence, label_id
detection_mapping:
  image_id: __frame_index__
  source: source
  label: label
  confidence: confidence
  image_confidence: image_confidence
  sensor_confidence: sensor_confidence
  sensor_raw_json: sensor_raw_json